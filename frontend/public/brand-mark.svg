<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Water meter brand mark</title>
  <desc id="desc">A glossy digital water meter with a cyan reservoir and pink droplet accent.</desc>
  <defs>
