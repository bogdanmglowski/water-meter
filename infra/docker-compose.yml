name: water-meter

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-water_meter}
      POSTGRES_USER: ${POSTGRES_USER:-meter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meter}
    volumes:
      - water-meter-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meter} -d ${POSTGRES_DB:-water_meter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  seed:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-water_meter}
      POSTGRES_USER: ${POSTGRES_USER:-meter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meter}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/seed.sql:/seed/seed.sql:ro
      - ./seed-if-empty.sh:/seed/seed-if-empty.sh:ro
    entrypoint: ["/bin/sh", "/seed/seed-if-empty.sh"]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meter}:${POSTGRES_PASSWORD:-meter}@db:5432/${POSTGRES_DB:-water_meter}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:${CLIENT_PORT:-5173}}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CLIENT_URL: ${CLIENT_URL:-http://${CLIENT_HOST:-localhost}:${CLIENT_PORT:-5173}}
      API_URL: ${API_URL:-http://${CLIENT_HOST:-localhost}:${CLIENT_PORT:-5173}/api/health}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"

  reader:
    profiles: ["reader"]
    build:
      context: ../reader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meter}:${POSTGRES_PASSWORD:-meter}@db:5432/${POSTGRES_DB:-water_meter}
      READER_SOURCE: ${READER_SOURCE:-usb}
      READER_CAMERA_INDEX: ${READER_CAMERA_INDEX:-0}
      READER_IP_CAMERA_URL: ${READER_IP_CAMERA_URL:-}
      READER_INTERVAL_SECONDS: ${READER_INTERVAL_SECONDS:-5}
      READER_PICTURES_DIR: /data/pictures
      READER_CSV_FILE: /data/readings.csv
      READER_NO_CSV: ${READER_NO_CSV:-true}
      READER_PERSIST_EVERY: ${READER_PERSIST_EVERY:-1}
      READER_PICTURE_TYPE: ${READER_PICTURE_TYPE:-raw}
      READER_CROP_OUTPUT: ${READER_CROP_OUTPUT:-/data/meter-crop.png}
      READER_DEBUG_OUTPUT: ${READER_DEBUG_OUTPUT:-}
      READER_X1: ${READER_X1:-159}
      READER_Y1: ${READER_Y1:-331}
      READER_X2: ${READER_X2:-565}
      READER_Y2: ${READER_Y2:-414}
      READER_PG_WRITE: ${READER_PG_WRITE:-true}
      READER_PG_SOURCE: ${READER_PG_SOURCE:-reader-docker}
      READER_PG_VALUE_MODE: ${READER_PG_VALUE_MODE:-truncate}
    command: ["/app/docker-run.sh"]
    volumes:
      - ../reader/runtime:/data
    devices:
      - "${READER_VIDEO_DEVICE:-/dev/video0}:${READER_VIDEO_DEVICE:-/dev/video0}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  water-meter-pg:
